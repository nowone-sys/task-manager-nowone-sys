<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能任务管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 16px;
      color: #333;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      color: #fff;
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.25);
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    /* 输入区 */
    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .input-row input {
      flex: 1; padding: 12px 14px; font-size: 1rem;
      border: 2px solid #e2e8f0; border-radius: 10px; outline: none;
      transition: border-color .2s;
    }
    .input-row input:focus { border-color: #667eea; }
    .input-row select {
      padding: 12px; font-size: 1rem; border: 2px solid #e2e8f0;
      border-radius: 10px; background: #fff; outline: none; cursor: pointer;
    }
    .btn {
      padding: 12px 22px; font-size: 1rem; border: none;
      border-radius: 10px; cursor: pointer; font-weight: bold;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-add { background: #667eea; color: #fff; }
    .btn-add:hover { opacity: .88; }
    /* 筛选区 */
    .filter-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-btn {
      padding: 8px 18px; font-size: .9rem; border-radius: 20px;
      border: 1.5px solid #e2e8f0; background: #fff; cursor: pointer;
      transition: all .2s;
    }
    .filter-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
    /* 任务列表 */
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border: 1.5px solid #eef1f6;
      border-radius: 12px; transition: box-shadow .2s;
    }
    .task-item:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .task-title { flex: 1; font-size: 1.02rem; word-break: break-all; }
    .task-item.completed .task-title {
      text-decoration: line-through; color: #b0b7c3;
    }
    .badge {
      padding: 3px 10px; border-radius: 12px; font-size: .78rem;
      font-weight: bold; color: #fff; white-space: nowrap;
    }
    .badge-高 { background: #ef4444; }
    .badge-中 { background: #f59e0b; }
    .badge-低 { background: #10b981; }
    .btn-sm {
      padding: 7px 14px; font-size: .85rem; border: none;
      border-radius: 8px; cursor: pointer; white-space: nowrap;
      transition: opacity .2s;
    }
    .btn-sm:hover { opacity: .85; }
    .btn-toggle { background: #dbeafe; color: #1d4ed8; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    .empty {
      text-align: center; color: #9aa3b2; padding: 36px 0; font-size: .95rem;
    }
    .error {
      background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
      border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
      font-size: .9rem; display: none;
    }
    .status {
      text-align: center; color: #9aa3b2; font-size: .85rem; margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ 智能任务管理系统</h1>
    <div class="card">
      <div class="error" id="errorBox"></div>

      <!-- 添加任务 -->
      <div class="input-row">
        <input id="titleInput" type="text" placeholder="输入任务标题..." maxlength="100">
        <select id="prioritySelect">
          <option value="高">高</option>
          <option value="中" selected>中</option>
          <option value="低">低</option>
        </select>
        <button class="btn btn-add" onclick="addTask()">添加</button>
      </div>

      <!-- 筛选 -->
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-p="全部">全部</button>
        <button class="filter-btn" data-p="高">高</button>
        <button class="filter-btn" data-p="中">中</button>
        <button class="filter-btn" data-p="低">低</button>
      </div>

      <!-- 列表 -->
      <div class="task-list" id="taskList"></div>
      <div class="status" id="statusBar"></div>
    </div>
  </div>

  <script>
    let currentFilter = '全部';
    let tasks = [];

    const $ = id => document.getElementById(id);

    function showError(msg) {
      const box = $('errorBox');
      if (msg) { box.textContent = '⚠️ ' + msg; box.style.display = 'block'; }
      else { box.style.display = 'none'; }
    }

    // 加载任务列表
    async function loadTasks() {
      showError('');
      try {
        const url = currentFilter === '全部'
          ? '/api/tasks'
          : '/api/tasks?priority=' + encodeURIComponent(currentFilter);
        const r = await fetch(url);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '加载失败');
        tasks = data;
        render();
      } catch (e) { showError(e.message); }
    }

    // 渲染列表
    function render() {
      const list = $('taskList');
      $('statusBar').textContent = `共 ${tasks.length} 条任务 · 数据存储于 Supabase 云端`;
      if (!tasks.length) {
        list.innerHTML = '<div class="empty">暂无任务，快添加一条吧～</div>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <div class="task-item ${t.completed ? 'completed' : ''}">
          <span class="badge badge-${t.priority}">${t.priority}</span>
          <span class="task-title">${escapeHtml(t.title)}</span>
          <button class="btn-sm btn-toggle" onclick="toggleTask(${t.id}, ${!t.completed})">
            ${t.completed ? '取消完成' : '完成'}
          </button>
          <button class="btn-sm btn-del" onclick="deleteTask(${t.id})">删除</button>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 添加
    async function addTask() {
      const title = $('titleInput').value.trim();
      if (!title) { showError('请输入任务标题'); return; }
      showError('');
      try {
        const r = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, priority: $('prioritySelect').value })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '添加失败');
        $('titleInput').value = '';
        await loadTasks();
      } catch (e) { showError(e.message); }
    }

    // 切换完成状态
    async function toggleTask(id, completed) {
      showError('');
      try {
        const r = await fetch('/api/tasks/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '更新失败');
        await loadTasks();
      } catch (e) { showError(e.message); }
    }

    // 删除
    async function deleteTask(id) {
      showError('');
      try {
        const r = await fetch('/api/tasks/' + id, { method: 'DELETE' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '删除失败');
        await loadTasks();
      } catch (e) { showError(e.message); }
    }

    // 筛选切换
    $('filterRow').addEventListener('click', e => {
      if (!e.target.dataset.p) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.p;
      loadTasks();
    });

    // 回车添加
    $('titleInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
  </script>
</body>
</html>
